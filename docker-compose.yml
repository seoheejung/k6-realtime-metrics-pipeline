services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft 단일 노드 식별자
      KAFKA_NODE_ID: 1
      # broker + controller 겸용 단일 노드
      KAFKA_PROCESS_ROLES: broker,controller
      # controller quorum 설정
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # 리스너 이름별 프로토콜 매핑
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      # 컨테이너 내부/외부 통신용 리스너
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      # 다른 컨테이너가 kafka:9092로 붙을 수 있게 광고
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:29092
      # broker 간 통신 리스너 이름
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # controller 리스너 이름
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 노드 개발용
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    user: "0:0"
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - influxdb_data:/var/lib/influxdb3/data

  app:
    build:
      context: ./app
    container_name: app
    hostname: app
    ports:
      - "8080:8080"

  collector:
    build:
      context: ./collector
    container_name: collector
    env_file:
      - ./collector/.env
    depends_on:
      - kafka
      - influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"

    environment:
      # Grafana 관리자 계정
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # datasource provisioning에서 사용하는 환경 변수
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on:
      - influxdb
    volumes:
      # Grafana 내부 DB (대시보드 상태 저장)
      - grafana_data:/var/lib/grafana
      # JSON dashboard 파일 위치
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      # provisioning 설정 (datasource + dashboard 자동 등록)
      - ./observability/grafana/provisioning:/etc/grafana/provisioning

volumes:
  kafka_data:
  influxdb_data:
  grafana_data: